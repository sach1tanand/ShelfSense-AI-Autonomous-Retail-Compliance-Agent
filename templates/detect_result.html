<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Detection Result</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <h1>Detection Result</h1>
  {% if result %}
    <p>Detections: {{ result.detections|length }}</p>
    <p>Inference time: {{ '%.2f'|format(result.detect_time) }} s</p>
    <p>Confidence threshold: {{ result.confidence }}</p>
    <div class="image-container">
      <img src="{{ url_for('detect_image', result_id=result_id) }}" alt="Annotated detection result">
    </div>
  {% else %}
    <p>No result found.</p>
  {% endif %}
  <p><a href="{{ url_for('dashboard') }}">← Back to Dashboard</a></p>
</body>
</html>
