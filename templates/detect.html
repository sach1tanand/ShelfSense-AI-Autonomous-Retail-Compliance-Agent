<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Run Product Detection</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <h1>Run Product Detection</h1>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <ul class="flashes">
        {% for category, message in messages %}
          <li class="{{ category }}">{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}
  <form action="{{ url_for('detect') }}" method="post" enctype="multipart/form-data">
    <label for="shelf_image">Shelf image:</label>
    <input type="file" name="shelf_image" id="shelf_image" required accept="{{ ','.join(ALLOWED_EXTENSIONS) }}">
    <br>
    <label for="confidence_threshold">Confidence ({{ settings.detection_confidence }} default):</label>
    <input type="number" step="0.01" min="0.1" max="0.95" name="confidence_threshold" id="confidence_threshold" placeholder="{{ settings.detection_confidence }}">
    <br>
    <button type="submit">Run Detection</button>
  </form>
  <p><a href="{{ url_for('dashboard') }}">← Back to Dashboard</a></p>
</body>
</html>
